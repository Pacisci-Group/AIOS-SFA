services:
  mongo:
    image: mongo:7
    container_name: sfa-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  minio:
    image: minio/minio:latest
    container_name: sfa-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    # Host ports 9100/9101 (9000/9001 are commonly taken by another MinIO). The
    # container still listens on 9000/9001 internally.
    ports:
      - "9100:9000" # S3 API
      - "9101:9001" # web console
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  # One-shot: create the uploads bucket so presigned PUTs work out of the box.
  minio-createbucket:
    image: minio/mc:latest
    container_name: sfa-minio-createbucket
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/sfa-uploads &&
      echo 'Bucket sfa-uploads ready';
      "
    restart: "no"

  api:
    build:
      context: .
      dockerfile: packages/api/Dockerfile
    container_name: sfa-api
    restart: unless-stopped
    ports:
      - "4000:4000"
    env_file:
      - .env
    environment:
      PORT: 4000
      MONGODB_URI: mongodb://mongo:27017/sfa
      CORS_ORIGIN: http://localhost:5173,http://localhost:4000
      # Object storage (MinIO). The API talks to MinIO over the compose network
      # (minio:9000) for server-side ops, but signs browser-facing presigned
      # URLs against the host-reachable public URL (localhost:9100 — see the
      # remapped host port above).
      STORAGE_ENDPOINT: http://minio:9000
      STORAGE_PUBLIC_URL: http://localhost:9100
      STORAGE_REGION: us-east-1
      STORAGE_BUCKET: sfa-uploads
      STORAGE_ACCESS_KEY_ID: minioadmin
      STORAGE_SECRET_ACCESS_KEY: minioadmin
      STORAGE_FORCE_PATH_STYLE: "true"
    depends_on:
      mongo:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4000/api/v1/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s
    command: >
      sh -c "node packages/api/dist/seed/seed.js && node packages/api/dist/main.js"

  web:
    build:
      context: .
      dockerfile: packages/web/Dockerfile
    container_name: sfa-web
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  mongo_data:
  minio_data:
