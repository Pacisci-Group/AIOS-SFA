server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    location /api/v1/ {
        proxy_pass http://api:4000/api/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Hashed build output: the filename changes whenever the contents do, so it
    # is safe to cache forever. `=404` rather than falling through to the SPA
    # rule below — a chunk deleted by the last deploy has to fail as a 404. The
    # fallback would answer 200 with index.html, and the browser rejects that as
    # the wrong MIME type, which reads as a build error rather than a cache miss.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # The shell names the hashed chunks, so a cached copy outlives the files it
    # points at and the app boots to a blank page after every deploy. Nginx sends
    # no Cache-Control here by default, which lets browsers cache it heuristically.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
