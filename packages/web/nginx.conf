server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # The notification stream (PAC-154): one Server-Sent Events response held
    # open per signed-in tab. Three things the general rule below would get
    # wrong, each of which presents as "notifications never arrive":
    #   proxy_buffering off  — nginx would otherwise collect the response until
    #                          its buffer fills, and a 20-byte frame never fills it.
    #   proxy_read_timeout 1h — the default (60s) cuts the stream whenever the
    #                          API is quiet; the API pings every 25s, so an hour
    #                          only matters if the ping stops, which is the
    #                          signal to reconnect anyway.
    #   Connection ""        — keep the upstream connection HTTP/1.1 keep-alive
    #                          rather than forwarding the client's `close`.
    # `=` so this wins over the prefix location regardless of order.
    location = /api/v1/notifications/stream {
        proxy_pass http://api:4000/api/v1/notifications/stream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location /api/v1/ {
        proxy_pass http://api:4000/api/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Hashed build output: the filename changes whenever the contents do, so it
    # is safe to cache forever. `=404` rather than falling through to the SPA
    # rule below — a chunk deleted by the last deploy has to fail as a 404. The
    # fallback would answer 200 with index.html, and the browser rejects that as
    # the wrong MIME type, which reads as a build error rather than a cache miss.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # The shell names the hashed chunks, so a cached copy outlives the files it
    # points at and the app boots to a blank page after every deploy. Nginx sends
    # no Cache-Control here by default, which lets browsers cache it heuristically.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
