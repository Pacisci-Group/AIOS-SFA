<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AgencyOps</title>
    <!--
      Applies the theme class before first paint. next-themes only sets it in an
      effect, which in a Vite SPA (no SSR) lands *after* the first paint — every
      dark-mode load would flash light. Must stay in sync with the provider in
      `src/app/ThemeProvider.tsx`: same storage key, same "dark" default.
    -->
    <script>
      (function () {
        var el = document.documentElement;
        var t = 'dark';
        try {
          var stored = localStorage.getItem('theme');
          if (stored === 'light' || stored === 'dark') {
            t = stored;
          } else if (stored === 'system') {
            t = window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light';
          }
        } catch (e) {
          /* Safari private mode throws on localStorage; fall through to dark. */
        }
        el.classList.add(t);
        el.style.colorScheme = t;
      })();
    </script>
    <!-- Inter is self-hosted via `@fontsource-variable/inter`, imported at the
         top of `src/styles/index.css`. Do not re-add a Google Fonts link. -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
