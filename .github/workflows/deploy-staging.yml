name: Deploy staging

# Push to the `staging` branch → deploy to the staging environment only.
on:
  push:
    branches: [staging]
    paths:
      - "packages/**"
      - "docker-compose.prod.yml"
      - ".github/workflows/deploy-staging.yml"
      - ".github/workflows/deploy.reusable.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    uses: ./.github/workflows/deploy.reusable.yml
    with:
      environment: staging
    secrets: inherit
