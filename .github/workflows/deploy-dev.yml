name: Deploy dev

# Push to the `dev` branch → deploy to the dev environment only.
on:
  push:
    branches: [dev]
    paths:
      - "packages/**"
      - "docker-compose.prod.yml"
      - "docker-compose.inngest.yml"
      - ".github/workflows/deploy-dev.yml"
      - ".github/workflows/deploy.reusable.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    uses: ./.github/workflows/deploy.reusable.yml
    with:
      environment: dev
    secrets: inherit
