name: Terraform Plan

# Runs for EVERY live environment, not just dev.
#
# It used to run for dev alone, which is how production's `main.tf` came to
# reference variables its own `variables.tf` never declared: nothing validated
# that directory, so the drift was invisible until someone planned it by hand.
# `terraform validate` in a matrix is what catches that class of error.
on:
  pull_request:
    paths:
      - "infra/terraform/**"
      - ".github/workflows/terraform-plan.yml"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
      - name: Terraform fmt check
        run: terraform fmt -check -recursive
        working-directory: infra/terraform

  plan:
    runs-on: ubuntu-latest
    strategy:
      # Every environment is reported, rather than stopping at the first
      # failure — knowing production is broken too is the point.
      fail-fast: false
      matrix:
        environment: [dev, production]

    defaults:
      run:
        working-directory: infra/terraform/environments/${{ matrix.environment }}

    env:
      DIGITALOCEAN_TOKEN: ${{ secrets.DO_API_TOKEN }}
      # Spaces credentials for the S3-compatible remote state backend
      AWS_ACCESS_KEY_ID: ${{ secrets.TF_STATE_ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.TF_STATE_SECRET_KEY }}
      # Spaces credentials for the *provider*. Distinct from the pair above:
      # those configure the state backend, these let the digitalocean provider
      # read/manage the uploads bucket and its CORS rules, which go over the S3
      # API rather than the DO API. Without them the plan fails on
      # digitalocean_spaces_bucket as soon as enable_spaces = true. Same
      # account-level Spaces key, so it reuses the TF_STATE_* secrets.
      SPACES_ACCESS_KEY_ID: ${{ secrets.TF_STATE_ACCESS_KEY }}
      SPACES_SECRET_ACCESS_KEY: ${{ secrets.TF_STATE_SECRET_KEY }}
      # Non-secret vars supplied via TF_VAR_ (secrets/IPs come from tfvars/secrets)
      TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      # ⚠ Both `backend.tf` and `terraform.tfvars` are gitignored — they are
      # generated per environment and the live tfvars may carry addresses we do
      # not publish. So a CI checkout almost always lacks them, and this job
      # validates the configuration rather than planning it against real state.
      # That still catches undeclared variables, bad references and type errors;
      # the blast radius of an actual change is read from `make plan` locally.
      - name: Guard against missing backend
        run: |
          if [ ! -f backend.tf ]; then
            echo "::notice::No backend.tf in environments/${{ matrix.environment }} (it is gitignored) — validating configuration only."
            echo "SKIP_REMOTE=true" >> "$GITHUB_ENV"
          fi

      - name: Terraform init (local, no backend)
        if: env.SKIP_REMOTE == 'true'
        run: terraform init -backend=false -input=false

      - name: Terraform validate
        if: env.SKIP_REMOTE == 'true'
        run: terraform validate

      - name: Terraform init
        if: env.SKIP_REMOTE != 'true'
        run: terraform init -input=false

      - name: Terraform plan
        if: env.SKIP_REMOTE != 'true'
        run: |
          if [ -f terraform.tfvars ]; then
            terraform plan -input=false -var-file=terraform.tfvars -no-color
          else
            terraform plan -input=false -no-color
          fi
