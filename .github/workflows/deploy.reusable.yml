name: Deploy (reusable)

# Shared build + deploy pipeline. Not triggered directly — called by the
# per-environment workflows (deploy-dev / deploy-staging / deploy-production),
# each of which passes the GitHub Environment to target.
on:
  workflow_call:
    inputs:
      environment:
        description: "Target GitHub Environment (dev | staging | production)"
        required: true
        type: string

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      api_image: ${{ steps.meta.outputs.api_image }}
      web_image: ${{ steps.meta.outputs.web_image }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute image refs
        id: meta
        run: |
          OWNER_REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "api_repo=${REGISTRY}/${OWNER_REPO}/api" >> "$GITHUB_OUTPUT"
          echo "web_repo=${REGISTRY}/${OWNER_REPO}/web" >> "$GITHUB_OUTPUT"
          echo "api_image=${REGISTRY}/${OWNER_REPO}/api:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "web_image=${REGISTRY}/${OWNER_REPO}/web:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/api/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.api_image }}
            ${{ steps.meta.outputs.api_repo }}:${{ inputs.environment }}
          cache-from: type=gha,scope=api-${{ inputs.environment }}
          cache-to: type=gha,scope=api-${{ inputs.environment }},mode=max

      - name: Build and push Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/web/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.web_image }}
            ${{ steps.meta.outputs.web_repo }}:${{ inputs.environment }}
          cache-from: type=gha,scope=web-${{ inputs.environment }}
          cache-to: type=gha,scope=web-${{ inputs.environment }},mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    # Selects the GitHub Environment. Its secrets (same names across all
    # environments) resolve to that environment's values.
    environment: ${{ inputs.environment }}
    outputs:
      # Republished for deploy-inngest, which cannot read it itself. See the
      # comment on that job.
      inngest_enabled: ${{ steps.flags.outputs.inngest_enabled }}
      node_edge_enabled: ${{ steps.flags.outputs.node_edge_enabled }}
      autoscale_enabled: ${{ steps.flags.outputs.autoscale_enabled }}
    steps:
      - uses: actions/checkout@v4

      # Environment variables ARE readable here — the environment is bound once
      # the job is running, unlike in a job-level `if`.
      - name: Resolve environment flags
        id: flags
        run: |
          enabled="${{ vars.INNGEST_ENABLED }}"
          echo "inngest_enabled=${enabled}" >> "$GITHUB_OUTPUT"
          if [ "$autoscale" = "true" ] && [ "$node_edge" != "true" ]; then
            # The pool assumes every node is interchangeable, which is only true
            # once certificates come from MongoDB rather than a node's disk.
            # With Caddy each droplet would run its own ACME client and race the
            # others for the same tenant hostnames.
            echo "::error::AUTOSCALE_ENABLED is true but NODE_EDGE_ENABLED is not. The pool requires the Node edge."
            exit 1
          fi

          if [ "$enabled" = "true" ]; then
            echo "Inngest is ENABLED for '${{ inputs.environment }}'."
          else
            # Loud rather than silent: a skipped deploy-inngest with no
            # explanation is indistinguishable from a broken workflow, which is
            # how this went unnoticed the first time.
            echo "::warning::INNGEST_ENABLED is '${enabled}' (not 'true') for the '${{ inputs.environment }}' Environment — deploy-inngest will be skipped and no async work will run. Set it under Settings > Environments > ${{ inputs.environment }} > Environment variables (NOT Secrets)."
          fi

          # Migrations normally apply themselves at API startup, which is what
          # makes "merge, deploy, done" the usual path. Setting this Environment
          # variable to 'false' suppresses that for the next deploy - the escape
          # hatch DEPLOYMENT.md describes, needed when a one-shot script has to
          # run BETWEEN two migrations (see scripts/migration/run-upgrade.sh).
          #
          # Unset means 'true'. It has to come from here rather than being
          # hand-edited on the droplet, because the .env below is rewritten in
          # full on every deploy - a hand edit does not survive the very deploy
          # it was meant to control.
          # The new topology: our own Node TLS edge instead of Caddy, the
          # worker as its own container on 4001, certificates in MongoDB.
          #
          # ⚠ Must agree with terraform's `enable_node_edge` for the same
          # environment. Terraform opens the firewall port and chooses the
          # droplet's cloud-init; this chooses what runs on it. Half of each is
          # an environment that passes every health check and runs no async
          # work, or one with no edge at all.
          # The app tier is an autoscale pool rather than one droplet. Implies
          # the Node edge, and changes how a deploy reaches the app: pool members
          # are never SSHed to, because a droplet created during a traffic spike
          # has nothing to SSH to it. Config is published instead.
          autoscale="${{ vars.AUTOSCALE_ENABLED || 'false' }}"
          echo "autoscale_enabled=${autoscale}" >> "$GITHUB_OUTPUT"

          node_edge="${{ vars.NODE_EDGE_ENABLED || 'false' }}"
          echo "node_edge_enabled=${node_edge}" >> "$GITHUB_OUTPUT"
          if [ "$node_edge" = "true" ]; then
            echo "Node edge ENABLED for '${{ inputs.environment }}' - Caddy is not in use here."
          else
            echo "Node edge disabled for '${{ inputs.environment }}' - Caddy remains the edge, worker runs inline."
          fi

          migrate_on_boot="${{ vars.DB_MIGRATE_ON_BOOT || 'true' }}"
          if [ "$migrate_on_boot" = "false" ]; then
            # Loud, and deliberately a warning rather than a note: left set, every
            # later deploy ships without applying its migrations and the app runs
            # against a database older than its code - silently, until something
            # reads a field that is not there yet.
            echo "::warning::DB_MIGRATE_ON_BOOT is 'false' for the '${{ inputs.environment }}' Environment - this deploy will NOT apply pending migrations. Run them by hand, then set the variable back to 'true' (or delete it) and re-run this workflow."
          else
            echo "Migrations WILL be applied at API startup for '${{ inputs.environment }}'."
          fi

      # Fail here rather than mid-rollout. Object storage in particular degrades
      # *silently*: with STORAGE_ENDPOINT unset, StorageService logs a warning,
      # disables itself, and the health check still passes — so a deploy missing
      # that secret looks completely green while every document upload fails.
      # PUBLIC_FORM_BASE_URL has the same shape of failure: unset, share links
      # are generated pointing at http://localhost:5173.
      - name: Preflight — required Environment secrets are set
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          JWT_ACCESS_SECRET: ${{ secrets.JWT_ACCESS_SECRET }}
          JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET }}
          CORS_ORIGIN: ${{ secrets.CORS_ORIGIN }}
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
          GHCR_PULL_USER: ${{ secrets.GHCR_PULL_USER }}
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
          STORAGE_ENDPOINT: ${{ secrets.STORAGE_ENDPOINT }}
          STORAGE_REGION: ${{ secrets.STORAGE_REGION }}
          STORAGE_BUCKET: ${{ secrets.STORAGE_BUCKET }}
          STORAGE_ACCESS_KEY_ID: ${{ secrets.STORAGE_ACCESS_KEY_ID }}
          STORAGE_SECRET_ACCESS_KEY: ${{ secrets.STORAGE_SECRET_ACCESS_KEY }}
          PUBLIC_FORM_BASE_URL: ${{ secrets.PUBLIC_FORM_BASE_URL }}
          # White labelling. PLATFORM_HOST is required for the same reason
          # APP_BASE_URL is, but with a louder failure: it decides who may sign
          # in on which hostname. Left unset it falls back to the host of
          # APP_BASE_URL, which is usually right — but "usually" is not a
          # property you want on an access-control setting, so it is named
          # explicitly. BASE_DOMAIN and PUBLIC_SERVER_IPS stay optional: without
          # them agency subdomains and A-record guidance are simply unavailable,
          # which is a missing feature rather than a broken deploy.
          PLATFORM_HOST: ${{ secrets.PLATFORM_HOST }}
          BASE_DOMAIN: ${{ secrets.BASE_DOMAIN }}
          PUBLIC_SERVER_IPS: ${{ secrets.PUBLIC_SERVER_IPS }}
          # Async work. RESEND_API_KEY belongs in this list for exactly the
          # reason STORAGE_ENDPOINT does: unset, the worker falls back to a
          # transport that logs instead of sending. The app boots, the health
          # check passes, Inngest runs complete successfully — and not one email
          # is delivered. Nothing downstream would ever surface that.
          INNGEST_BASE_URL: ${{ secrets.INNGEST_BASE_URL }}
          INNGEST_EVENT_KEY: ${{ secrets.INNGEST_EVENT_KEY }}
          INNGEST_SIGNING_KEY: ${{ secrets.INNGEST_SIGNING_KEY }}
          APP_PRIVATE_IP: ${{ secrets.APP_PRIVATE_IP }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          MAIL_DEFAULT_FROM: ${{ secrets.MAIL_DEFAULT_FROM }}
          INNGEST_ENABLED: ${{ vars.INNGEST_ENABLED }}
          # TLS. Required only where the platform issues its own certificates.
          # CERT_ENCRYPTION_KEY unset means every issuance throws and every
          # renewal silently stops — the certificates already cached on a node
          # keep serving, so nothing looks wrong until a node restarts.
          ACME_ENABLED: ${{ vars.ACME_ENABLED }}
          # Where the pool reads its config. Without these the publish step has
          # nowhere to write, and every droplet keeps serving the previous
          # deploy indefinitely — with nothing failing to say so.
          AUTOSCALE_ENABLED: ${{ vars.AUTOSCALE_ENABLED }}
          DEPLOY_CONFIG_BUCKET: ${{ secrets.DEPLOY_CONFIG_BUCKET }}
          DEPLOY_CONFIG_ENDPOINT: ${{ secrets.DEPLOY_CONFIG_ENDPOINT }}
          DEPLOY_CONFIG_ACCESS_KEY_ID: ${{ secrets.DEPLOY_CONFIG_ACCESS_KEY_ID }}
          DEPLOY_CONFIG_SECRET_ACCESS_KEY: ${{ secrets.DEPLOY_CONFIG_SECRET_ACCESS_KEY }}
          ACME_DIRECTORY_URL: ${{ secrets.ACME_DIRECTORY_URL }}
          CERT_ENCRYPTION_KEY: ${{ secrets.CERT_ENCRYPTION_KEY }}
        run: |
          set -uo pipefail

          required="SSH_HOST SSH_KEY MONGODB_URI JWT_ACCESS_SECRET
                    JWT_REFRESH_SECRET CORS_ORIGIN APP_BASE_URL GHCR_PULL_USER
                    GHCR_PULL_TOKEN STORAGE_ENDPOINT STORAGE_REGION
                    STORAGE_BUCKET STORAGE_ACCESS_KEY_ID
                    STORAGE_SECRET_ACCESS_KEY PUBLIC_FORM_BASE_URL
                    PLATFORM_HOST"

          # The async secrets are required only where Inngest is turned on, so
          # an environment that predates async work keeps deploying unchanged.
          # Gated on the same INNGEST_ENABLED variable as the deploy-inngest job
          # and terraform's enable_inngest, so the three cannot disagree.
          if [ "${INNGEST_ENABLED}" = "true" ]; then
            required="${required}
                      INNGEST_BASE_URL INNGEST_EVENT_KEY INNGEST_SIGNING_KEY
                      APP_PRIVATE_IP RESEND_API_KEY MAIL_DEFAULT_FROM"
          fi

          # Same shape, same reason: required only where the feature is switched
          # on, so an environment that does not issue certificates keeps
          # deploying unchanged.
          #
          # ACME_DIRECTORY_URL is named explicitly rather than left to its
          # default, because the default is the STAGING CA and its certificates
          # are not trusted by browsers. A deployed environment must say which
          # CA it means.
          if [ "${ACME_ENABLED}" = "true" ]; then
            required="${required} ACME_DIRECTORY_URL CERT_ENCRYPTION_KEY"
          fi

          # An autoscale environment is deployed to by publishing, so SSH_HOST
          # stops being how the app is reached — but these become load-bearing.
          if [ "${AUTOSCALE_ENABLED}" = "true" ]; then
            required="${required}
                      DEPLOY_CONFIG_BUCKET DEPLOY_CONFIG_ENDPOINT
                      DEPLOY_CONFIG_ACCESS_KEY_ID DEPLOY_CONFIG_SECRET_ACCESS_KEY"
          fi

          missing=""
          for name in $required; do
            if [ -z "${!name}" ]; then
              missing="${missing} ${name}"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing secrets in the '${{ inputs.environment }}' GitHub Environment:${missing}"
            echo "See DEPLOYMENT.md → 'Environment secrets'. Storage values come from"
            echo "'terraform output' in infra/terraform/environments/${{ inputs.environment }}."
            exit 1
          fi
          echo "All required secrets are present."

      # Rendered ONCE, here, and then merely delivered differently depending on
      # the topology. The two delivery paths below must never grow their own
      # copy of this: an environment file that differs between a pooled and a
      # single-droplet environment is precisely the silent divergence this whole
      # piece of work exists to remove.
      #
      # REWRITTEN IN FULL on every deploy — anything hand-edited on a droplet is
      # lost. Every runtime variable the app needs is listed here and backed by
      # an Environment secret.
      - name: Render runtime env
        env:
          API_IMAGE: ${{ needs.build-and-push.outputs.api_image }}
          WEB_IMAGE: ${{ needs.build-and-push.outputs.web_image }}
        run: |
          set -euo pipefail

          # Which process serves the Inngest functions, and therefore which port
          # the firewall must admit. Exactly one process may serve them.
          #
          #   new topology: the worker, its own container on 4001
          #   old topology: the API, in-process on 4000
          #
          # Written as whole lines rather than as a flag the app interprets, so
          # the file reads as a description of what is actually running.
          if [ "${{ steps.flags.outputs.node_edge_enabled }}" = "true" ]; then
            TOPOLOGY_LINES="WORKER_INLINE=false
          WORKER_INNGEST_BIND=${{ secrets.APP_PRIVATE_IP }}:4001"
          else
            TOPOLOGY_LINES="API_INNGEST_BIND=${{ secrets.APP_PRIVATE_IP }}:4000"
          fi

          # A pool member has no other way to authenticate to the registry: it is
          # never SSHed to, so nothing runs `docker login` on it. Its converge
          # script reads these from the published file instead.
          umask 077
          cat > app.env <<EOF
          GHCR_PULL_USER=${{ secrets.GHCR_PULL_USER }}
          GHCR_PULL_TOKEN=${{ secrets.GHCR_PULL_TOKEN }}
          API_IMAGE=${API_IMAGE}
          WEB_IMAGE=${WEB_IMAGE}
          WEB_BIND=127.0.0.1:8080
          NODE_ENV=production
          PORT=4000
          MONGODB_URI=${{ secrets.MONGODB_URI }}
          # 'false' suppresses the startup migration run for this deploy - see
          # "Resolve environment flags" above, and DEPLOYMENT.md.
          DB_MIGRATE_ON_BOOT=${{ vars.DB_MIGRATE_ON_BOOT || 'true' }}
          JWT_ACCESS_SECRET=${{ secrets.JWT_ACCESS_SECRET }}
          JWT_REFRESH_SECRET=${{ secrets.JWT_REFRESH_SECRET }}
          JWT_ACCESS_EXPIRES=15m
          JWT_REFRESH_EXPIRES=7d
          CORS_ORIGIN=${{ secrets.CORS_ORIGIN }}
          # Base URL every invite / accept-invite link is built from
          # (UsersService.buildInviteUrl). Unset, it falls back to
          # http://localhost:5173 and every invite email ships a dead link
          # while the API, the send and the delivery record all look healthy.
          APP_BASE_URL=${{ secrets.APP_BASE_URL }}

          # Object storage (DigitalOcean Spaces) — document uploads.
          # Values come from the environment's terraform outputs:
          #   spaces_endpoint / spaces_region / spaces_bucket /
          #   spaces_access_key_id / spaces_secret_access_key
          STORAGE_ENDPOINT=${{ secrets.STORAGE_ENDPOINT }}
          STORAGE_REGION=${{ secrets.STORAGE_REGION }}
          STORAGE_BUCKET=${{ secrets.STORAGE_BUCKET }}
          STORAGE_ACCESS_KEY_ID=${{ secrets.STORAGE_ACCESS_KEY_ID }}
          STORAGE_SECRET_ACCESS_KEY=${{ secrets.STORAGE_SECRET_ACCESS_KEY }}
          # Spaces uses virtual-host addressing (bucket.region.digitaloceanspaces.com).
          # Only MinIO needs path-style, so this is false everywhere but local dev.
          STORAGE_FORCE_PATH_STYLE=false
          # STORAGE_PUBLIC_URL is intentionally unset: the API and the browser
          # reach Spaces at the same endpoint, unlike the local MinIO split.

          # Base URL used to build shareable public intake links. Unset, the API
          # falls back to http://localhost:5173 and every shared link is dead.
          PUBLIC_FORM_BASE_URL=${{ secrets.PUBLIC_FORM_BASE_URL }}
          PLATFORM_HOST=${{ secrets.PLATFORM_HOST }}
          BASE_DOMAIN=${{ secrets.BASE_DOMAIN }}
          PUBLIC_SERVER_IPS=${{ secrets.PUBLIC_SERVER_IPS }}

          # Rate limits for the public (unauthenticated) intake routes. Optional —
          # unset resolves to the defaults in config/rate-limit.config.ts, which
          # parses an empty value back to the default. These must be real
          # environment variables, and env_file makes them exactly that: the
          # @Throttle decorators are evaluated at class-definition time, before
          # ConfigModule has loaded any dotenv file.
          RATE_LIMIT_SHORT=${{ secrets.RATE_LIMIT_SHORT }}
          RATE_LIMIT_LONG=${{ secrets.RATE_LIMIT_LONG }}
          PUBLIC_FORM_RATE_LIMIT=${{ secrets.PUBLIC_FORM_RATE_LIMIT }}
          PUBLIC_INTAKE_RATE_LIMIT=${{ secrets.PUBLIC_INTAKE_RATE_LIMIT }}
          PUBLIC_INTAKE_HOURLY_LIMIT=${{ secrets.PUBLIC_INTAKE_HOURLY_LIMIT }}

          # Async work. Every outbound email and every scheduled job runs as
          # an Inngest function served from this container at /api/inngest.
          #
          # Which process serves the Inngest functions, and on which private
          # port — see the shell above. Never 0.0.0.0 in either case: that
          # endpoint is raw Express middleware none of the global guards see,
          # and its only authentication is the Inngest request signature.
          #
          # WORKER_INLINE must be a real environment variable, which env_file
          # makes it: `main.ts` reads it while the module graph is built,
          # before ConfigModule has loaded any dotenv file.
          ${TOPOLOGY_LINES}
          INNGEST_BASE_URL=${{ secrets.INNGEST_BASE_URL }}
          INNGEST_EVENT_KEY=${{ secrets.INNGEST_EVENT_KEY }}
          INNGEST_SIGNING_KEY=${{ secrets.INNGEST_SIGNING_KEY }}
          # Must be "0". Left unset the SDK infers dev mode from NODE_ENV and
          # stops verifying request signatures.
          INNGEST_DEV=0

          # Outbound email. RESEND_API_KEY unset means the worker silently
          # falls back to a logging transport — see the preflight note.
          RESEND_API_KEY=${{ secrets.RESEND_API_KEY }}
          MAIL_DEFAULT_FROM=${{ secrets.MAIL_DEFAULT_FROM }}
          MAIL_REPLY_TO=${{ secrets.MAIL_REPLY_TO }}

          # TLS certificates. The platform issues its own, for the platform
          # host and for every agency domain, and stores them in MongoDB so
          # any app node can serve any hostname.
          #
          # Off unless the Environment variable is literally "true": issuance
          # needs us to own port 80 to answer the CA's validation request, so
          # this is turned on in the same change that puts the Node edge in
          # front of the app.
          ACME_ENABLED=${{ vars.ACME_ENABLED || 'false' }}
          ACME_DIRECTORY_URL=${{ secrets.ACME_DIRECTORY_URL }}
          ACME_CONTACT_EMAIL=${{ secrets.ACME_CONTACT_EMAIL }}
          CERT_ENCRYPTION_KEY=${{ secrets.CERT_ENCRYPTION_KEY }}

          # The edge. Only started when the `edge` compose profile is active.
          #
          # ⚠ EDGE_PROXY_PROTOCOL must be false until a load balancer sits in
          # front AND is configured to send the header. A header is a claim
          # about who the peer is: trusting it from a direct client lets
          # anyone forge a source address and evade rate limiting. Enabling it
          # on only one side is the mirror failure — the header is read as the
          # first bytes of a TLS handshake and every connection breaks.
          EDGE_PROXY_PROTOCOL=${{ vars.EDGE_PROXY_PROTOCOL || 'false' }}
          EOF

      # ── Autoscale pool: publish, do not deploy ──────────────────────────────
      #
      # There is nothing to SSH to. A droplet created during a traffic spike at
      # 3am has to configure itself, so the deploy publishes and every droplet —
      # running now or created later — converges on the same object within 30s.
      - name: Publish config for the pool
        if: steps.flags.outputs.autoscale_enabled == 'true'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.DEPLOY_CONFIG_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.DEPLOY_CONFIG_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.DEPLOY_CONFIG_REGION }}
          BUCKET: ${{ secrets.DEPLOY_CONFIG_BUCKET }}
          ENDPOINT: ${{ secrets.DEPLOY_CONFIG_ENDPOINT }}
        run: |
          set -euo pipefail
          # The compose file first, then the env. Droplets checksum BOTH
          # together and only act when the pair changes, so ordering cannot
          # leave one applied without the other.
          aws s3 cp docker-compose.prod.yml "s3://$BUCKET/current/docker-compose.prod.yml" --endpoint-url "$ENDPOINT"
          aws s3 cp app.env "s3://$BUCKET/current/app.env" --endpoint-url "$ENDPOINT"
          echo "Published. Pool members converge within ~30s."

      # ── Single droplet: the original path, unchanged in behaviour ───────────

      # `scp-action` runs drone-scp inside its own container, which is not the
      # user that owns the workspace — so it cannot read the 0600 file the
      # render step produced, and `tar` fails with "Permission denied" before
      # anything is copied.
      #
      # Loosened here rather than in the render step, so the file is tight by
      # default and only relaxed on the one path that cannot read it otherwise.
      # A GitHub-hosted runner is a single-use VM dedicated to this job and the
      # file exists for seconds; the copy that lands on the droplet is put in
      # place with `install -m 0600` and the 0644 original deleted immediately.
      - name: Make the rendered env readable by the copy action
        if: steps.flags.outputs.autoscale_enabled != 'true'
        run: chmod 0644 app.env

      - name: Copy compose file and env to droplet
        if: steps.flags.outputs.autoscale_enabled != 'true'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: deploy
          key: ${{ secrets.SSH_KEY }}
          source: "docker-compose.prod.yml,app.env"
          target: "/opt/sfa"

      - name: Deploy on droplet
        if: steps.flags.outputs.autoscale_enabled != 'true'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: deploy
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -euo pipefail
            cd /opt/sfa

            if [ "${{ steps.flags.outputs.node_edge_enabled }}" = "true" ]; then
              COMPOSE_PROFILE="--profile edge"
            else
              COMPOSE_PROFILE=""
            fi

            # The rendered file, put in place. Same content the pool receives.
            install -m 0600 app.env .env
            rm -f app.env

            echo "${{ secrets.GHCR_PULL_TOKEN }}" | docker login ghcr.io -u "${{ secrets.GHCR_PULL_USER }}" --password-stdin

            # shellcheck disable=SC2086 # deliberately unquoted: empty must expand to nothing.
            docker compose -f docker-compose.prod.yml $COMPOSE_PROFILE pull
            # --remove-orphans retires the previous topology's containers on the
            # deploy that flips a flag.
            docker compose -f docker-compose.prod.yml $COMPOSE_PROFILE up -d --remove-orphans
            docker image prune -f

      # ── Autoscale pool: check through the load balancer ─────────────────────
      #
      # From the runner, over the public path: DNS -> balancer -> a pool member
      # -> the edge. That is the only check that proves the thing users actually
      # touch, and it is the only one available — there is no droplet to SSH to.
      - name: Health check (pool)
        if: steps.flags.outputs.autoscale_enabled == 'true'
        run: |
          set -uo pipefail
          HOST=$(echo "${{ secrets.APP_BASE_URL }}" | sed -E 's#^https?://##; s#/.*$##')
          echo "Checking https://$HOST through the load balancer."

          # Plain HTTP, and /healthz specifically: it is answered by the edge
          # itself and is never redirected, so it works before DNS has settled,
          # before any certificate exists, and on a first deploy. A pool member
          # that fails this is one the balancer will not send traffic to either.
          #
          # Deliberately generous: a converge tick is up to 30s, and a droplet
          # has to pull images before it can answer at all.
          for i in $(seq 1 40); do
            if curl -fsS --max-time 10 "http://$HOST/healthz" >/dev/null; then
              echo "Edge is reachable through the load balancer."
              break
            fi
            if [ "$i" -eq 40 ]; then
              echo "::error::No pool member is answering /healthz through the load balancer."
              echo "Check, in order:"
              echo " 1. Does the pool have any droplet? (DigitalOcean console -> Droplets, tag sfa-<env>-pool)"
              echo " 2. Did it converge?  ssh in and: journalctl -u sfa-converge -n 50"
              echo " 3. Is the balancer health check passing? It probes :8081/healthz,"
              echo "    which must NOT be behind PROXY protocol — see modules/loadbalancer."
              echo " 4. Do AUTOSCALE/pool_proxy_protocol and EDGE_PROXY_PROTOCOL agree?"
              echo "    Either alone breaks every connection through the balancer."
              exit 1
            fi
            echo "Waiting for the pool... ($i)"
            sleep 15
          done

          # The app behind the edge. A WARNING rather than a failure, because on
          # the very first deploy of a new environment no certificate exists yet
          # — the worker issues it moments later — and TLS genuinely cannot work
          # until it does. Failing here would make the bootstrap deploy
          # impossible to ever run successfully.
          if curl -fsS --max-time 15 "https://$HOST/api/v1/health" >/dev/null; then
            echo "App is healthy over HTTPS."
          else
            echo "::warning::HTTPS is not serving $HOST yet. Expected on a first deploy, while the worker obtains the certificate. Confirm with: docker compose logs worker | grep -i 'platform host'"
          fi

      - name: Health check
        if: steps.flags.outputs.autoscale_enabled != 'true'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: deploy
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e
            for i in $(seq 1 20); do
              if curl -fsS http://127.0.0.1:8080/api/v1/health >/dev/null; then
                echo "Health check passed."
                break
              fi
              if [ "$i" -eq 20 ]; then
                echo "Health check failed."
                docker compose -f /opt/sfa/docker-compose.prod.yml logs --tail=100
                exit 1
              fi
              echo "Waiting for app... ($i)"
              sleep 5
            done

            NODE_EDGE="${{ steps.flags.outputs.node_edge_enabled }}"
            if [ "$NODE_EDGE" != "true" ]; then
              echo "Old topology: the API serves the Inngest functions in-process, and Caddy is the edge. Nothing further to check."
              exit 0
            fi

            # The edge first: it is the only thing bound to a public port, so if
            # it is down the site is down however healthy everything behind it
            # looks.
            #
            # /healthz is answered by the edge itself rather than proxied — a
            # check that went through to the app would report the web
            # container's health and say nothing about the process terminating
            # TLS. Plain HTTP on purpose: it has to work before DNS, before any
            # certificate, and on the bare IP.
            for i in $(seq 1 20); do
              if curl -fsS http://127.0.0.1:80/healthz >/dev/null; then
                echo "Edge is up."
                break
              fi
              if [ "$i" -eq 20 ]; then
                echo "::error::The TLS edge is not answering on port 80. The site is not being served."
                docker compose -f /opt/sfa/docker-compose.prod.yml logs --tail=100 edge
                exit 1
              fi
              echo "Waiting for edge... ($i)"
              sleep 5
            done

            # The worker is a separate container on this topology, and the API's
            # health says nothing about it.
            #
            # ⚠ 401 is the HEALTHY answer, and 200 would be the worrying one.
            # With INNGEST_DEV=0 and a signing key set, the SDK refuses an
            # unsigned GET outright ("No x-inngest-signature provided"). So a
            # 401 proves the process is listening, the handler is mounted, and
            # signature verification is on — and a 200 would mean the signing
            # key is missing or INNGEST_DEV is wrong, which is the one state
            # this endpoint must never be in.
            #
            # Addressed on the PRIVATE IP, not loopback: that is where the
            # container publishes and the address Inngest itself uses, so this
            # also proves the binding is right rather than just that a process
            # exists.
            #
            # Whether the functions actually SYNCED is a different question, and
            # not one that can be answered from this side. `deploy-inngest`
            # asks Inngest itself (`functionCount > 0`), which is the real
            # end-to-end check.
            for i in $(seq 1 20); do
              # `-w` already prints 000 when the connection fails, so `|| true`
              # rather than a fallback echo — which would concatenate onto it.
              code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 \
                "http://${{ secrets.APP_PRIVATE_IP }}:4001/api/inngest" || true)
              case "$code" in
                401) echo "Worker is up, and is verifying Inngest signatures."; exit 0 ;;
                200)
                  echo "::error::The worker answered an UNSIGNED request with 200 at /api/inngest."
                  echo "Its only authentication is the Inngest request signature, so this means"
                  echo "INNGEST_SIGNING_KEY is unset or INNGEST_DEV is not '0'. Refusing to pass."
                  exit 1 ;;
              esac
              echo "Waiting for worker... ($i) [last status: $code]"
              sleep 5
            done
            echo "::error::The worker container is not serving /api/inngest. No async work will run."
            docker compose -f /opt/sfa/docker-compose.prod.yml logs --tail=100 worker
            exit 1

  # Self-hosted Inngest, on its own droplet. Nothing of ours is built for it —
  # this pulls an upstream image and hands it a config file.
  #
  # Gated on an Environment *variable* rather than the presence of a secret, so
  # "this environment has no Inngest" is an explicit statement someone made in
  # the GitHub UI rather than something inferred from an omission. The same flag
  # gates the preflight secrets above and terraform's `enable_inngest`.
  #
  # Runs AFTER the app deploy on purpose: Inngest syncs function definitions
  # from the API's /api/inngest at boot, so deploying it against an already-
  # running app makes the sync verification below deterministic instead of a
  # race against the poll interval.
  deploy-inngest:
    needs: deploy
    # Gated on a job OUTPUT, not directly on `vars.INNGEST_ENABLED`.
    #
    # ⚠ An Environment-level variable CANNOT gate a job here. A job-level `if`
    # is evaluated before the job is dispatched to a runner, which is before
    # the `environment:` below has been bound — so `vars.INNGEST_ENABLED`
    # resolves against repository/organisation variables only, finds nothing,
    # and the job silently skips. It skips whether or not the variable is set
    # correctly, which makes the failure look exactly like a misconfiguration.
    #
    # `deploy` reads the same variable at STEP level, where the environment IS
    # bound, and republishes it as an output. Same flag, same source of truth,
    # evaluated somewhere it actually resolves.
    if: ${{ needs.deploy.outputs.inngest_enabled == 'true' }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4

      # Which key are we authenticating with, and does the target match the
      # droplet Terraform built? Both values are PUBLIC — a fingerprint and a
      # public key reveal nothing that a server does not already hand out.
      #
      # Added because `ssh: unable to authenticate` gives no clue whether the
      # secret is wrong, the host is wrong, or the droplet never got the key,
      # and none of those are diagnosable from a laptop that lacks the key.
      #
      # Compare the fingerprint below against:
      #   terraform output -raw ... ; ssh-keygen -lf <the ssh_public_key in tfvars>
      # A mismatch means SSH_KEY and infra/terraform tfvars have drifted apart.
      - name: Diagnose SSH identity and target
        run: |
          set -uo pipefail
          umask 077
          printf '%s\n' "${{ secrets.SSH_KEY }}" > /tmp/id_deploy
          chmod 600 /tmp/id_deploy

          echo "Target host: ${{ secrets.INNGEST_SSH_HOST }}"
          echo "App droplet: ${{ secrets.SSH_HOST }}  (this key is known to work there)"
          echo
          echo "Public half of the SSH_KEY secret:"
          ssh-keygen -y  -f /tmp/id_deploy || echo "  !! SSH_KEY is not a readable private key"
          echo "Fingerprint:"
          ssh-keygen -lf /tmp/id_deploy -E md5 || true

          echo
          echo "Host keys offered by the Inngest droplet (proves we reach the right box):"
          ssh-keyscan -T 10 "${{ secrets.INNGEST_SSH_HOST }}" 2>/dev/null | ssh-keygen -lf - || \
            echo "  !! could not reach ${{ secrets.INNGEST_SSH_HOST }} on port 22"

          rm -f /tmp/id_deploy

      # A freshly built droplet is reachable over SSH long before cloud-init
      # has finished with it: sshd comes from the base image, while the deploy
      # user, Docker and /opt/sfa-inngest all arrive later from runcmd.
      #
      # Deploying into that window fails in ways that look like anything but a
      # race - a rejected SSH key, or
      #   tar: docker-compose.inngest.yml: Cannot open: Permission denied
      # - and re-running "fixes" it, which is how the race hides.
      #
      # So block until provisioning is actually finished, then assert the two
      # things every later step depends on.
      - name: Wait for cloud-init, and assert the droplet is provisioned
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.INNGEST_SSH_HOST }}
          username: deploy
          key: ${{ secrets.SSH_KEY }}
          command_timeout: 10m
          script: |
            # --wait blocks until cloud-init reaches a terminal state. It exits
            # non-zero on 'degraded', which is worth reporting but not fatal on
            # its own, so judge by the concrete checks below instead.
            cloud-init status --wait >/dev/null 2>&1 || true
            cloud-init status --long || true

            if ! command -v docker >/dev/null; then
              echo "::error::Docker is not installed on the Inngest droplet. cloud-init did not complete its runcmd - check /var/log/cloud-init-output.log."
              exit 1
            fi
            if ! sudo -n docker compose version >/dev/null 2>&1 && ! docker compose version >/dev/null 2>&1; then
              echo "::error::The docker compose plugin is missing on the Inngest droplet."
              exit 1
            fi
            if [ ! -w /opt/sfa-inngest ]; then
              echo "::error::/opt/sfa-inngest is not writable by the deploy user. Ownership is set at the top of runcmd; if this fails, cloud-init did not get that far."
              ls -ld /opt/sfa-inngest || true
              exit 1
            fi
            echo "Droplet is provisioned: docker present, /opt/sfa-inngest writable."

      - name: Copy compose file to the Inngest droplet
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.INNGEST_SSH_HOST }}
          username: deploy
          key: ${{ secrets.SSH_KEY }}
          source: "docker-compose.inngest.yml"
          target: "/opt/sfa-inngest"

      - name: Deploy Inngest
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.INNGEST_SSH_HOST }}
          username: deploy
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -euo pipefail
            cd /opt/sfa-inngest

            # Rewritten in full every deploy, same as /opt/sfa/.env — anything
            # hand-edited on the droplet is lost. Every variable Inngest needs
            # has to be listed here and backed by an Environment secret.
            umask 077
            # Which port on the app droplet serves the functions. Derived from
            # the same flag as the firewall rule and the compose profile, so the
            # three cannot disagree:
            #   new topology -> 4001, the worker's own container
            #   old topology -> 4000, the API in-process
            if [ "${{ needs.deploy.outputs.node_edge_enabled }}" = "true" ]; then
              APP_INNGEST_PORT=4001
            else
              APP_INNGEST_PORT=4000
            fi

            cat > /opt/sfa-inngest/.env <<EOF
            INNGEST_EVENT_KEY=${{ secrets.INNGEST_EVENT_KEY }}
            INNGEST_SIGNING_KEY=${{ secrets.INNGEST_SIGNING_KEY }}
            # Where our functions are served: the app droplet's PRIVATE address.
            APP_PRIVATE_IP=${{ secrets.APP_PRIVATE_IP }}
            APP_INNGEST_PORT=${APP_INNGEST_PORT}
            EOF

            docker compose -f docker-compose.inngest.yml pull
            docker compose -f docker-compose.inngest.yml up -d --remove-orphans
            docker image prune -f

      # A health check alone is not enough here. Inngest can be perfectly
      # healthy while having synced zero functions — because the app was
      # unreachable, the URL was wrong, or the signing keys disagree. That state
      # is invisible: every check passes and no async work ever runs. So assert
      # the thing we actually care about, which is that it found our functions.
      - name: Verify Inngest synced our functions
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.INNGEST_SSH_HOST }}
          username: deploy
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -uo pipefail
            for i in $(seq 1 20); do
              # GraphQL, not /v0/apps — that path 404s on `inngest start`; it
              # only exists on the dev server. /api/v1/apps is the dashboard SPA
              # and returns HTML. Asking the wrong endpoint fails this check on
              # every deploy, forever.
              body=$(curl -fsS -X POST -H 'content-type: application/json' \
                       -d '{"query":"{ apps { name url connected functionCount error } }"}' \
                       http://127.0.0.1:8288/v0/gql 2>/dev/null || true)
              # functionCount > 0, not merely "an app exists". An app that synced
              # zero functions is the failure worth catching: healthy, connected,
              # and running nothing.
              if echo "$body" | grep -qE '"functionCount":[[:space:]]*[1-9]'; then
                echo "Inngest has synced our functions."
                exit 0
              fi
              echo "Waiting for function sync... ($i)"
              sleep 5
            done
            echo "::error::Inngest is running but synced no functions from the app droplet."
            echo "Check, in order:"
            echo " 1. The app droplet's firewall admits the port serving /api/inngest."
            echo "    That is terraform's enable_node_edge: true opens 4001, false opens 4000."
            echo "    It must match NODE_EDGE_ENABLED for this Environment - a mismatch"
            echo "    opens a port with nothing behind it and refuses every invocation."
            echo " 2. INNGEST_SIGNING_KEY matches on both sides."
            echo " 3. The process that should serve them is running: the worker container"
            echo "    on the new topology, or the API with WORKER_INLINE unset on the old."
            docker compose -f /opt/sfa-inngest/docker-compose.inngest.yml logs --tail=100
            exit 1
