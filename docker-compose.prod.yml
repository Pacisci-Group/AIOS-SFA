# Production/staging/dev-server Docker Compose for SFA.
#
# Differences from local docker-compose.yml:
#   - No MongoDB container (uses DigitalOcean Managed MongoDB via MONGODB_URI)
#   - No MinIO container (uses DigitalOcean Spaces via STORAGE_*)
#   - Uses pre-built images from the registry (no build on the droplet)
#   - No auto-seed on startup (run `docker compose run --rm api node packages/api/dist/seed/seed.js` once, manually)
#   - Web is published only to loopback (127.0.0.1:8080); host Nginx terminates TLS and proxies to it
#   - The worker runs as its OWN container and is the only process serving
#     /api/inngest. It is published on the droplet's PRIVATE IP
#     (WORKER_INNGEST_BIND) so the Inngest droplet can invoke functions over the
#     VPC. The API is published on loopback only.
#
# /opt/sfa/.env is written in full by .github/workflows/deploy.reusable.yml on
# every deploy — edit the GitHub Environment secrets, not the file on the box.
#
# Required variables (from /opt/sfa/.env):
#   API_IMAGE, WEB_IMAGE  -> full registry image refs (e.g. ghcr.io/owner/repo/api:sha)
#   MONGODB_URI           -> managed MongoDB connection string. Must be a replica
#                            set (DO Managed MongoDB is) — the lead-intake
#                            pipeline writes lead+household+contacts in one
#                            transaction and silently degrades without one.
#   JWT_ACCESS_SECRET, JWT_REFRESH_SECRET
#   CORS_ORIGIN           -> e.g. https://dev.example.com
#   WEB_BIND              -> host bind for web (default 127.0.0.1:8080)
#   STORAGE_ENDPOINT, STORAGE_REGION, STORAGE_BUCKET,
#   STORAGE_ACCESS_KEY_ID, STORAGE_SECRET_ACCESS_KEY,
#   STORAGE_FORCE_PATH_STYLE=false
#                         -> Spaces bucket for document uploads. Missing values
#                            disable uploads *silently* — the API still boots and
#                            passes its health check.
#   PUBLIC_FORM_BASE_URL  -> public site URL; share links are built from it
#   PLATFORM_HOST         -> the ONE hostname the super-admin app answers on.
#                            Access control, not cosmetics: agency users are
#                            refused here and platform admins are refused on
#                            agency hosts. A wrong value reads as "nobody can
#                            log in".
#   BASE_DOMAIN           -> parent zone for agency subdomains. Optional; unset
#                            disables subdomain creation (custom domains still
#                            work).
#   PUBLIC_SERVER_IPS     -> comma-separated public IPs, so the settings page
#                            can tell an owner what to put in an A record. Only
#                            an apex domain needs one — RFC 1034 forbids a CNAME
#                            there.
#   WORKER_INNGEST_BIND   -> "<droplet private IP>:4001". Inngest reaches the
#                            serve handler here; the firewall admits only the
#                            Inngest droplet.
#   WORKER_INLINE=false   -> REQUIRED now that the worker is its own container.
#                            Left true, both processes register under the same
#                            Inngest app id and whichever synced last wins.
#   INNGEST_BASE_URL, INNGEST_EVENT_KEY, INNGEST_SIGNING_KEY, INNGEST_DEV=0
#                         -> the self-hosted Inngest server. INNGEST_DEV must be
#                            "0" or the SDK infers dev mode and stops verifying
#                            request signatures.
#   RESEND_API_KEY, MAIL_DEFAULT_FROM
#                         -> outbound email. A missing RESEND_API_KEY disables
#                            sending *silently* — the worker falls back to a
#                            logging transport, boots, and passes every health
#                            check. Same failure shape as the STORAGE_* vars.
#
# Optional (defaults in packages/api/src/config/rate-limit.config.ts):
#   RATE_LIMIT_SHORT, RATE_LIMIT_LONG, PUBLIC_FORM_RATE_LIMIT,
#   PUBLIC_INTAKE_RATE_LIMIT, PUBLIC_INTAKE_HOURLY_LIMIT

services:
  api:
    image: ${API_IMAGE}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 4000
    # Loopback only. The API no longer serves /api/inngest at all — with
    # WORKER_INLINE=false the `worker` service below owns every function, and it
    # is the only thing the Inngest droplet needs to reach. Dropping the VPC
    # binding shrinks this container's exposure to nothing beyond the host.
    #
    # The loopback publish stays, and is load-bearing until the Node edge lands:
    # Caddy's on-demand TLS gate runs on the host and calls
    # `ask http://127.0.0.1:4000/api/v1/public/domains/allow` before issuing any
    # certificate. Without a loopback listener every `ask` is refused and Caddy
    # issues no certificate for any hostname — not the tenant subdomains and not
    # the platform host. The symptom is a site with no TLS at all.
    ports:
      - "127.0.0.1:4000:4000"
      # The VPC binding, used ONLY by environments still on the old topology,
      # where the API serves the Inngest functions in-process. There the deploy
      # sets API_INNGEST_BIND to the droplet's private IP and the firewall admits
      # 4000 from the Inngest droplet.
      #
      # On the new topology the deploy leaves it unset, this collapses onto the
      # loopback mapping above (`:-` treats unset and empty alike, and Compose
      # de-duplicates identical mappings), and the worker owns 4001 instead. It
      # can therefore never degrade to 0.0.0.0 in either mode.
      - "${API_INNGEST_BIND:-127.0.0.1:4000}:4000"
    networks:
      - sfa
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4000/api/v1/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # Async work as its own container. Started by default — this is no longer an
  # optional split.
  #
  # ## Why it is mandatory now
  # The API tier is being moved behind a load balancer onto an autoscale pool,
  # and exactly ONE process may serve the Inngest functions. With the worker
  # inline, N API nodes all register under the same Inngest app id and whichever
  # synced last wins — so async work would land on an arbitrary node and stop
  # entirely on the rest. Inngest also invokes functions at a single address, and
  # a pool has no single address to give it.
  #
  # Splitting the worker out is therefore the prerequisite for horizontal
  # scaling, not a tuning knob. `WORKER_INLINE=false` is written into
  # /opt/sfa/.env by the deploy workflow; the API then mounts no serve handler
  # (see the guard in `main.ts`).
  #
  # `--scale worker=N` fans out when async volume justifies it. Note that the
  # single `WORKER_INNGEST_BIND` host port is what stops that working today —
  # fanning out needs the worker behind its own internal load balancer, which is
  # the same phase that puts the API behind one.
  worker:
    # Part of the new topology, with the `edge` service below. Started only when
    # the deploy passes `--profile edge`, which it does when the environment's
    # NODE_EDGE_ENABLED variable is true.
    #
    # In one profile with the edge rather than its own, because the pieces are
    # not independently useful: the worker on 4001 needs the firewall rule that
    # `enable_node_edge` opens, and WORKER_INLINE=false without a worker running
    # means an environment that serves no Inngest functions at all.
    profiles: ["edge"]
    image: ${API_IMAGE}
    command: ["node", "packages/api/dist/worker.js"]
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      WORKER_PORT: 4001
    # Published on the droplet's PRIVATE IP so the Inngest droplet can invoke
    # functions over the VPC. Defaults to loopback, so an unset value degrades to
    # "unreachable", never to 0.0.0.0.
    #
    # ⚠ Never bind this to 0.0.0.0. /api/inngest is raw Express middleware that
    # none of the global guards see; its only authentication is Inngest's request
    # signature, and the DO firewall (port 4001, Inngest droplet only) is the
    # second layer.
    ports:
      - "${WORKER_INNGEST_BIND:-127.0.0.1:4001}:4001"
    networks:
      - sfa
    healthcheck:
      # ⚠ 401 is the HEALTHY answer here, and 200 would be the worrying one.
      #
      # The serve endpoint used to answer an unsigned GET with its function
      # count. It does not any more: with INNGEST_DEV=0 and a signing key set,
      # the SDK refuses an unsigned request outright —
      # "No x-inngest-signature provided" — and returns 401. So a 401 proves
      # three things at once: the process is listening, the Inngest handler is
      # mounted, and signature verification is switched on. A 200 would mean the
      # signing key is missing or INNGEST_DEV is wrong, which is the one state
      # this endpoint must never be in: it is raw Express middleware that none
      # of the global guards see, and the signature is its only authentication.
      #
      # Whether the functions actually SYNCED is a different question, and one
      # this container cannot answer. The `deploy-inngest` job asks Inngest
      # itself (`functionCount > 0`), which is the real end-to-end check.
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4001/api/inngest').then((r) => process.exit([200, 401].includes(r.status) ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # The edge: TLS termination, on the same image as everything else.
  #
  # ## What replaced what
  # Caddy used to do this on the host, holding certificates on local disk and
  # obtaining them on demand. That disk is the one piece of genuinely node-local
  # state in the white-label design, and it is what stopped the app tier from
  # scaling — every node would run its own ACME client and race the others for
  # the same hostnames.
  #
  # This reads certificates from MongoDB by SNI instead, so a node that joined
  # the pool seconds ago serves a tenant domain added minutes ago without having
  # issued anything. Issuance and renewal belong to the worker.
  #
  # ## Why it is in the app image
  # Same image, different entrypoint — the `worker` pattern. It needs the
  # certificate schema and the at-rest cipher, both of which live in
  # packages/api, and one image is one thing to build, push, pin and roll back.
  #
  # ⚠ `dist/edge.js` must be an entry in packages/api/webpack.config.js. The
  # runner stage copies `dist` and never `src`, so a non-entry simply does not
  # exist here and the container exits with MODULE_NOT_FOUND.
  edge:
    profiles: ["edge"]
    image: ${API_IMAGE}
    command: ["node", "packages/api/dist/edge.js"]
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    env_file:
      - .env
    environment:
      NODE_ENV: production
      # Where TLS-terminated traffic is sent. The compose network, so the web
      # container needs no host publish for this to work.
      EDGE_UPSTREAM: http://web:80
    # The only service bound to public ports. 80 is NOT optional: ACME http-01
    # validation is a plain-HTTP request to the hostname being issued, so
    # closing it means no certificate is ever obtained.
    ports:
      - "${EDGE_HTTP_BIND:-0.0.0.0}:80:80"
      - "${EDGE_HTTPS_BIND:-0.0.0.0}:443:443"
    networks:
      - sfa
    healthcheck:
      # Asks the edge's own plain-HTTP listener, which answers /healthz without
      # proxying. A check through to the app would make this report the web
      # container's health rather than the edge's.
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:80/healthz').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  web:
    image: ${WEB_IMAGE}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_BIND:-127.0.0.1:8080}:80"
    networks:
      - sfa
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

networks:
  sfa:
    driver: bridge
