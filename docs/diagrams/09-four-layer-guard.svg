<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 520" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#1565C0"/>
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#C62828"/>
    </marker>
    <style>
      .guard { fill: #E3F2FD; stroke: #1565C0; stroke-width: 2; rx: 8; }
      .ok { fill: #E8F5E9; stroke: #2E7D32; stroke-width: 2; rx: 8; }
      .deny { fill: #FFEBEE; stroke: #C62828; stroke-width: 2; rx: 8; }
      .label { font-size: 12px; fill: #263238; }
      .line { stroke: #1565C0; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .fail { stroke: #C62828; stroke-width: 1.5; fill: none; marker-end: url(#arrow-red); stroke-dasharray: 5,3; }
    </style>
  </defs>
  <rect class="guard" x="110" y="20" width="200" height="40"/><text class="label" x="210" y="45" text-anchor="middle">Incoming Request</text>
  <rect class="guard" x="90" y="80" width="240" height="44"/><text class="label" x="210" y="100" text-anchor="middle">1. JWT Auth  Valid login?</text>
  <rect class="guard" x="90" y="144" width="240" height="44"/><text class="label" x="210" y="164" text-anchor="middle">2. Tenant Guard  Correct agency?</text>
  <rect class="guard" x="90" y="208" width="240" height="44"/><text class="label" x="210" y="228" text-anchor="middle">3. Branch Guard  Correct branch?</text>
  <rect class="guard" x="90" y="272" width="240" height="44"/><text class="label" x="210" y="292" text-anchor="middle">4. Module Guard  Feature enabled?</text>
  <rect class="guard" x="90" y="336" width="240" height="44"/><text class="label" x="210" y="356" text-anchor="middle">5. Permission Guard  Role allows?</text>
  <rect class="ok" x="120" y="410" width="180" height="44"/><text class="label" x="210" y="437" text-anchor="middle" font-weight="bold">Process Request</text>
  <rect class="deny" x="300" y="200" width="100" height="40"/><text class="label" x="350" y="225" text-anchor="middle">403 Forbidden</text>

  <line class="line" x1="210" y1="60" x2="210" y2="80"/>
  <line class="line" x1="210" y1="124" x2="210" y2="144"/>
  <line class="line" x1="210" y1="188" x2="210" y2="208"/>
  <line class="line" x1="210" y1="252" x2="210" y2="272"/>
  <line class="line" x1="210" y1="316" x2="210" y2="336"/>
  <line class="line" x1="210" y1="380" x2="210" y2="410"/>
  <line class="fail" x1="330" y1="102" x2="350" y2="200"/>
  <line class="fail" x1="330" y1="166" x2="350" y2="210"/>
  <line class="fail" x1="330" y1="230" x2="350" y2="220"/>
  <line class="fail" x1="330" y1="294" x2="350" y2="230"/>
  <line class="fail" x1="330" y1="358" x2="350" y2="240"/>
</svg>
