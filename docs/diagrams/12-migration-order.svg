  <rect class="step" x="40" y="356" width="200" height="36"/><text class="num" x="55" y="379">7.</text><text class="label" x="75" y="379">Households</text>
  <rect class="step" x="40" y="412" width="200" height="36"/><text class="num" x="55" y="435">8.</text><text class="label" x="75" y="435">Leads</text>
  <rect class="step" x="40" y="468" width="200" height="36"/><text class="num" x="55" y="491">9.</text><text class="label" x="75" y="491">Quote Recaps</text>
  <rect class="step" x="40" y="524" width="200" height="36"/><text class="num" x="55" y="547">10.</text><text class="label" x="75" y="547">Deals</text>
  <rect class="step" x="40" y="580" width="200" height="36"/><text class="num" x="55" y="603">11.</text><text class="label" x="75" y="603">Policies &amp; related</text>
  <rect class="step" x="40" y="636" width="200" height="36"/><text class="num" x="55" y="659">12.</text><text class="label" x="75" y="659">Service Tickets</text>
  <rect class="step" x="40" y="692" width="200" height="36"/><text class="num" x="55" y="715">13.</text><text class="label" x="75" y="715">Attachments</text>
  <rect class="step" x="40" y="748" width="200" height="40" style="fill:#E8F5E9;stroke:#2E7D32;stroke-width:2;rx:8"/><text class="num" fill="#2E7D32" x="55" y="773">14.</text><text class="label" x="75" y="773" font-weight="bold">Validate</text>

  <line class="line" x1="140" y1="56" x2="140" y2="76"/>
