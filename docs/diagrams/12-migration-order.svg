<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 900" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#E65100"/>
    </marker>
    <style>
      .step { fill: #FFF3E0; stroke: #E65100; stroke-width: 2; rx: 8; }
      .label { font-size: 11px; fill: #263238; }
      .num { font-size: 10px; fill: #E65100; font-weight: bold; }
      .line { stroke: #E65100; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect class="step" x="40" y="20" width="200" height="36"/><text class="num" x="55" y="43">1.</text><text class="label" x="75" y="43">Agencies</text>
