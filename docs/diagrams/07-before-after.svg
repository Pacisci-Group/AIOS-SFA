<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#455A64"/>
    </marker>
    <style>
      .before { fill: #FFEBEE; stroke: #C62828; stroke-width: 2; rx: 8; }
      .after { fill: #E8F5E9; stroke: #2E7D32; stroke-width: 2; rx: 8; }
      .node { fill: #fff; stroke: #546E7A; stroke-width: 1.5; rx: 6; }
      .group-before { fill: #FFF5F5; stroke: #C62828; stroke-width: 2; rx: 12; }
      .group-after { fill: #F1F8F4; stroke: #2E7D32; stroke-width: 2; rx: 12; }
      .label { font-size: 11px; fill: #263238; }
      .title { font-size: 14px; font-weight: bold; }
      .line { stroke: #455A64; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect class="group-before" x="30" y="20" width="300" height="340"/>
  <text class="title" fill="#C62828" x="180" y="48" text-anchor="middle">Today</text>
  <rect class="node" x="130" y="70" width="100" height="32"/><text class="label" x="180" y="91" text-anchor="middle">Staff</text>
  <rect class="before" x="110" y="130" width="140" height="36"/><text class="label" x="180" y="153" text-anchor="middle">SFA App</text>
  <rect class="node" x="60" y="210" width="100" height="30"/><text class="label" x="110" y="230" text-anchor="middle">Clerk Login</text>
  <rect class="node" x="180" y="210" width="110" height="30"/><text class="label" x="235" y="230" text-anchor="middle">SmartSuite</text>
  <rect class="node" x="60" y="260" width="100" height="30"/><text class="label" x="110" y="280" text-anchor="middle">Fillout</text>
  <rect class="node" x="180" y="260" width="110" height="30"/><text class="label" x="235" y="280" text-anchor="middle">BigQuery</text>
  <line class="line" x1="180" y1="102" x2="180" y2="130"/>
  <line class="line" x1="150" y1="166" x2="110" y2="210"/>
  <line class="line" x1="180" y1="166" x2="235" y2="210"/>
  <line class="line" x1="160" y1="166" x2="110" y2="260"/>
  <line class="line" x1="200" y1="166" x2="235" y2="260"/>

  <rect class="group-after" x="390" y="20" width="300" height="340"/>
  <text class="title" fill="#2E7D32" x="540" y="48" text-anchor="middle">Future</text>
  <rect class="node" x="490" y="70" width="100" height="32"/><text class="label" x="540" y="91" text-anchor="middle">Staff</text>
  <rect class="after" x="470" y="130" width="140" height="36"/><text class="label" x="540" y="153" text-anchor="middle">SFA App</text>
  <rect class="after" x="470" y="220" width="140" height="36"/><text class="label" x="540" y="243" text-anchor="middle">NestJS Backend</text>
  <rect class="node" x="490" y="300" width="100" height="36" style="fill:#E3F2FD;stroke:#1565C0;stroke-width:2;rx:8"/><text class="label" x="540" y="323" text-anchor="middle">MongoDB</text>
  <line class="line" x1="540" y1="102" x2="540" y2="130"/>
  <line class="line" x1="540" y1="166" x2="540" y2="220"/>
  <line class="line" x1="540" y1="256" x2="540" y2="300"/>

  <text class="label" x="360" y="200" text-anchor="middle" font-size="24" fill="#1565C0">’</text>
</svg>
