<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 320" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#455A64"/>
    </marker>
    <marker id="arrow-back" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2E7D32"/>
    </marker>
    <style>
      .actor { fill: #ECEFF1; stroke: #455A64; stroke-width: 2; rx: 6; }
      .msg { stroke: #1565C0; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
      .msg-back { stroke: #2E7D32; stroke-width: 1.5; fill: none; marker-end: url(#arrow-back); stroke-dasharray: 5,3; }
      .label { font-size: 11px; fill: #263238; }
      .lifeline { stroke: #BDBDBD; stroke-width: 1; stroke-dasharray: 4,4; }
    </style>
  </defs>
  <rect class="actor" x="30" y="20" width="100" height="36"/><text class="label" x="80" y="43" text-anchor="middle">Browser</text>
  <rect class="actor" x="190" y="20" width="100" height="36"/><text class="label" x="240" y="43" text-anchor="middle">Next.js</text>
  <rect class="actor" x="350" y="20" width="100" height="36"/><text class="label" x="400" y="43" text-anchor="middle">NestJS API</text>
  <rect class="actor" x="510" y="20" width="100" height="36"/><text class="label" x="560" y="43" text-anchor="middle">MongoDB</text>
  <line class="lifeline" x1="80" y1="56" x2="80" y2="300"/>
  <line class="lifeline" x1="240" y1="56" x2="240" y2="300"/>
  <line class="lifeline" x1="400" y1="56" x2="400" y2="300"/>
  <line class="lifeline" x1="560" y1="56" x2="560" y2="300"/>

  <line class="msg" x1="80" y1="80" x2="240" y2="80"/><text class="label" x="160" y="75" text-anchor="middle">Login</text>
  <line class="msg" x1="240" y1="100" x2="400" y2="100"/><text class="label" x="320" y="95" text-anchor="middle">POST /auth/login</text>
  <line class="msg" x1="400" y1="120" x2="560" y2="120"/><text class="label" x="480" y="115" text-anchor="middle">Verify credentials</text>
  <line class="msg-back" x1="560" y1="140" x2="400" y2="140"/><text class="label" x="480" y="155" text-anchor="middle">User data</text>
  <line class="msg-back" x1="400" y1="160" x2="240" y2="160"/><text class="label" x="320" y="175" text-anchor="middle">JWT tokens</text>
  <line class="msg-back" x1="240" y1="180" x2="80" y2="180"/><text class="label" x="160" y="195" text-anchor="middle">Dashboard</text>

  <line class="msg" x1="80" y1="220" x2="240" y2="220"/><text class="label" x="160" y="215" text-anchor="middle">View Leads</text>
  <line class="msg" x1="240" y1="240" x2="400" y2="240"/><text class="label" x="320" y="235" text-anchor="middle">GET /leads + JWT</text>
  <text class="label" x="400" y="260" text-anchor="middle" font-size="10">Guards: auth ’ tenant ’ branch ’ module</text>
  <line class="msg" x1="400" y1="270" x2="560" y2="270"/><text class="label" x="480" y="265" text-anchor="middle">Query leads</text>
  <line class="msg-back" x1="560" y1="290" x2="80" y2="290"/><text class="label" x="320" y="305" text-anchor="middle">Leads table displayed</text>
</svg>
