<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6A1B9A"/>
    </marker>
    <style>
      .admin { fill: #F3E5F5; stroke: #6A1B9A; stroke-width: 2; rx: 8; }
      .mod { fill: #fff; stroke: #7B1FA2; stroke-width: 1.5; rx: 6; }
      .settings { fill: #EDE7F6; stroke: #512DA8; stroke-width: 2; rx: 8; }
      .staff { fill: #E8F5E9; stroke: #2E7D32; stroke-width: 2; rx: 8; }
      .label { font-size: 12px; fill: #263238; }
      .line { stroke: #6A1B9A; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect class="admin" x="280" y="20" width="160" height="40"/><text class="label" x="360" y="45" text-anchor="middle" font-weight="bold">Super Admin</text>
  <rect class="settings" x="230" y="100" width="260" height="44"/><text class="label" x="360" y="128" text-anchor="middle">Module Settings (per Agency)</text>

  <rect class="mod" x="40" y="190" width="110" height="32"/><text class="label" x="95" y="211" text-anchor="middle">Dashboard</text>
  <rect class="mod" x="170" y="190" width="90" height="32"/><text class="label" x="215" y="211" text-anchor="middle">Leads</text>
  <rect class="mod" x="280" y="190" width="110" height="32"/><text class="label" x="335" y="211" text-anchor="middle">Quote Recaps</text>
  <rect class="mod" x="410" y="190" width="110" height="32"/><text class="label" x="465" y="211" text-anchor="middle">Clients &amp; CRM</text>
  <rect class="mod" x="540" y="190" width="100" height="32"/><text class="label" x="590" y="211" text-anchor="middle">Deal Audits</text>
  <rect class="mod" x="100" y="250" width="90" height="32"/><text class="label" x="145" y="271" text-anchor="middle">Mailers</text>
  <rect class="mod" x="210" y="250" width="150" height="32"/><text class="label" x="285" y="271" text-anchor="middle">Performance</text>
  <rect class="mod" x="380" y="250" width="110" height="32"/><text class="label" x="435" y="271" text-anchor="middle">Management</text>

  <rect class="staff" x="180" y="330" width="360" height="50"/><text class="label" x="360" y="355" text-anchor="middle">Agency Owner &amp; Staff</text><text class="label" x="360" y="372" text-anchor="middle" font-size="10">Only see enabled modules</text>

  <line class="line" x1="360" y1="60" x2="360" y2="100"/>
  <line class="line" x1="300" y1="144" x2="95" y2="190"/>
  <line class="line" x1="330" y1="144" x2="215" y2="190"/>
  <line class="line" x1="360" y1="144" x2="335" y2="190"/>
  <line class="line" x1="390" y1="144" x2="465" y2="190"/>
  <line class="line" x1="420" y1="144" x2="590" y2="190"/>
  <line class="line" x1="360" y1="144" x2="145" y2="250"/>
  <line class="line" x1="360" y1="144" x2="285" y2="250"/>
  <line class="line" x1="360" y1="144" x2="435" y2="250"/>
  <line class="line" x1="360" y1="282" x2="360" y2="330"/>
</svg>
