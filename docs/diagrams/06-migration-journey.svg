<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 140" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#E65100"/>
    </marker>
    <style>
      .phase { fill: #FFF3E0; stroke: #E65100; stroke-width: 2; rx: 10; }
      .item { fill: #fff; stroke: #EF6C00; stroke-width: 1.5; rx: 6; }
      .label { font-size: 11px; fill: #263238; }
      .title { font-size: 12px; font-weight: bold; fill: #E65100; }
      .line { stroke: #E65100; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect class="phase" x="20" y="30" width="240" height="90"/>
  <text class="title" x="140" y="52" text-anchor="middle">Phase 1: Foundation</text>
  <rect class="item" x="40" y="65" width="90" height="28"/><text class="label" x="85" y="83" text-anchor="middle">New backend</text>
  <rect class="item" x="150" y="65" width="90" height="28"/><text class="label" x="195" y="83" text-anchor="middle">Login &amp; perms</text>

  <rect class="phase" x="310" y="30" width="280" height="90"/>
  <text class="title" x="450" y="52" text-anchor="middle">Phase 2: Data Move</text>
  <rect class="item" x="325" y="65" width="75" height="28"/><text class="label" x="362" y="83" text-anchor="middle">Export</text>
  <rect class="item" x="410" y="65" width="75" height="28"/><text class="label" x="447" y="83" text-anchor="middle">Import</text>
  <rect class="item" x="495" y="65" width="75" height="28"/><text class="label" x="532" y="83" text-anchor="middle">Validate</text>

  <rect class="phase" x="640" y="30" width="240" height="90"/>
  <text class="title" x="760" y="52" text-anchor="middle">Phase 3: Go Live</text>
  <rect class="item" x="660" y="65" width="90" height="28"/><text class="label" x="705" y="83" text-anchor="middle">Switch over</text>
  <rect class="item" x="770" y="65" width="90" height="28"/><text class="label" x="815" y="83" text-anchor="middle">Retire tools</text>

  <line class="line" x1="260" y1="75" x2="310" y2="75"/>
  <line class="line" x1="590" y1="75" x2="640" y2="75"/>
</svg>
