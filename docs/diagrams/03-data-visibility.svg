<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 340" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#455A64"/>
    </marker>
    <style>
      .role { fill: #fff; stroke: #546E7A; stroke-width: 2; rx: 6; }
      .view { fill: #E8EAF6; stroke: #3949AB; stroke-width: 2; rx: 8; }
      .label { font-size: 12px; fill: #263238; }
      .title { font-size: 13px; font-weight: bold; fill: #1A237E; }
      .group { fill: #F5F5F5; stroke: #BDBDBD; stroke-width: 2; rx: 10; }
      .line { stroke: #455A64; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect class="group" x="380" y="20" width="280" height="300"/>
  <text class="title" x="520" y="45" text-anchor="middle">Data Visibility</text>
  <rect class="view" x="420" y="70" width="200" height="50"/><text class="label" x="520" y="92" text-anchor="middle">My View</text><text class="label" x="520" y="108" text-anchor="middle" font-size="10">Records assigned to me</text>
  <rect class="view" x="420" y="140" width="200" height="50"/><text class="label" x="520" y="162" text-anchor="middle">Branch View</text><text class="label" x="520" y="178" text-anchor="middle" font-size="10">All records in my branch</text>
  <rect class="view" x="420" y="210" width="200" height="50"/><text class="label" x="520" y="232" text-anchor="middle">Agency View</text><text class="label" x="520" y="248" text-anchor="middle" font-size="10">All branches combined</text>

  <rect class="role" x="40" y="60" width="120" height="32"/><text class="label" x="100" y="81" text-anchor="middle">Producer</text>
  <rect class="role" x="40" y="110" width="120" height="32"/><text class="label" x="100" y="131" text-anchor="middle">CRM</text>
  <rect class="role" x="40" y="160" width="120" height="32"/><text class="label" x="100" y="181" text-anchor="middle">Branch Manager</text>
  <rect class="role" x="40" y="210" width="120" height="32"/><text class="label" x="100" y="231" text-anchor="middle">Agency Owner</text>
  <rect class="role" x="40" y="260" width="120" height="32"/><text class="label" x="100" y="281" text-anchor="middle">Super Admin</text>

  <line class="line" x1="160" y1="76" x2="420" y2="95"/>
  <line class="line" x1="160" y1="126" x2="420" y2="95"/>
  <line class="line" x1="160" y1="126" x2="420" y2="165"/>
  <line class="line" x1="160" y1="176" x2="420" y2="165"/>
  <line class="line" x1="160" y1="226" x2="420" y2="235"/>
  <line class="line" x1="160" y1="276" x2="420" y2="235"/>
</svg>
