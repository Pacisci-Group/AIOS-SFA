<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 160" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#1565C0"/>
    </marker>
    <style>
      .sales { fill: #E3F2FD; stroke: #1565C0; stroke-width: 2; rx: 8; }
      .service { fill: #E8F5E9; stroke: #2E7D32; stroke-width: 2; rx: 8; }
      .group-sales { fill: #F5FAFF; stroke: #1565C0; stroke-width: 2; rx: 10; }
      .group-service { fill: #F1F8F4; stroke: #2E7D32; stroke-width: 2; rx: 10; }
      .label { font-size: 12px; fill: #263238; }
      .title { font-size: 13px; font-weight: bold; }
      .line { stroke: #455A64; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect class="group-sales" x="20" y="30" width="380" height="100"/>
  <text class="title" fill="#1565C0" x="210" y="55" text-anchor="middle">Sales</text>
  <rect class="sales" x="40" y="70" width="90" height="44"/><text class="label" x="85" y="90" text-anchor="middle">New Lead</text><text class="label" x="85" y="105" text-anchor="middle" font-size="10">enters system</text>
  <rect class="sales" x="160" y="70" width="100" height="44"/><text class="label" x="210" y="90" text-anchor="middle">Quote Recap</text><text class="label" x="210" y="105" text-anchor="middle" font-size="10">created</text>
  <rect class="sales" x="290" y="70" width="90" height="44"/><text class="label" x="335" y="97" text-anchor="middle">Deal Sold</text>

  <rect class="group-service" x="420" y="30" width="460" height="100"/>
  <text class="title" fill="#2E7D32" x="650" y="55" text-anchor="middle">Service</text>
  <rect class="service" x="440" y="70" width="90" height="44"/><text class="label" x="485" y="97" text-anchor="middle">Onboarding</text>
  <rect class="service" x="560" y="70" width="100" height="44"/><text class="label" x="610" y="97" text-anchor="middle">Active Client</text>
  <rect class="service" x="690" y="70" width="110" height="44"/><text class="label" x="745" y="97" text-anchor="middle">Service Tickets</text>

  <line class="line" x1="130" y1="92" x2="160" y2="92"/>
  <line class="line" x1="260" y1="92" x2="290" y2="92"/>
  <line class="line" x1="380" y1="92" x2="440" y2="92"/>
  <line class="line" x1="530" y1="92" x2="560" y2="92"/>
  <line class="line" x1="660" y1="92" x2="690" y2="92"/>
</svg>
